name: mobile

# Independent native acceptance for obelisk-capacitor: build the obelisk web
# bundle once on Linux, then run the very same bytes inside a real iOS
# Simulator and Android Emulator against a real TLS backend.
#
# Runs on sibling PRs, master pushes (the sibling's own release validation)
# and on demand. Both platform jobs must pass for a sibling release; a
# platform failure is a release blocker, not grounds for skipping it.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.2"
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    allow-import-from-derivation = true
    extra-substituters = https://cache.nixos.org https://cache.iog.io https://nixcache.reflex-frp.org
    extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= ryantrinkle.com-1:JJiAKaRv9mWgpVAz8dwewnZe0AzzEAzPkagE9SP5NWI=

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true
            extra-substituters = https://cache.nixos.org https://cache.iog.io https://nixcache.reflex-frp.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= ryantrinkle.com-1:JJiAKaRv9mWgpVAz8dwewnZe0AzzEAzPkagE9SP5NWI=
      - name: CLI unit tests
        run: |
          npm ci --no-audit --no-fund
          node --test test/bundle.test.mjs test/cli.test.mjs
      - name: Build the portable web bundle
        run: |
          nix-build examples/counter/default.nix -A nixpkgs.webBundle.js -o result-mobile
          # A regular-file archive: consumers need neither the producer's
          # Nix store nor any symlink.
          mkdir bundle
          cp -RL result-mobile/. bundle/
          chmod -R u+rw bundle
          find bundle -type l | grep -q . && { echo 'symlink in bundle'; exit 1; } || true
          sha256sum bundle/ghcjs/all.js | tee bundle/all.js.sha256
          tar -C bundle -czf web-bundle.tar.gz .
      - name: Build the Linux test backend (closure for the android job)
        run: |
          # The asset-tree IFD chain can stall nondeterministically; bound each
          # attempt and retry once instead of burning the job budget on a hang.
          build_backend() {
            timeout 4500 nix-build examples/counter/native-backend.nix --arg bundle "$PWD/bundle" -o "$RUNNER_TEMP/result-backend"
          }
          set +e
          build_backend
          RC=$?
          set -e
          if [ "$RC" != "0" ]; then
            echo "backend build attempt rc=$RC; retrying once"
            sleep 10
            build_backend
          fi
          BACKEND_OUT=$(readlink -f "$RUNNER_TEMP/result-backend")
          echo "$BACKEND_OUT" > backend-path.txt
          nix copy --to file://$PWD/backend-closure "$BACKEND_OUT"
          tar -czf backend-closure.tar.gz backend-closure backend-path.txt
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: web-bundle.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: linux-backend
          path: backend-closure.tar.gz
          retention-days: 14

  ios:
    runs-on: macos-15
    needs: bundle
    # The darwin backend build is a cold nix build; give it room.
    timeout-minutes: 240
    env:
      XCODE_APP: /Applications/Xcode_26.2.app
      SIM_RUNTIME: iOS26.2
      SIM_DEVICE: iPhone 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true
            extra-substituters = https://cache.nixos.org https://cache.iog.io https://nixcache.reflex-frp.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= ryantrinkle.com-1:JJiAKaRv9mWgpVAz8dwewnZe0AzzEAzPkagE9SP5NWI=
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
      - name: Unpack the web bundle
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf web-bundle.tar.gz -C "$RUNNER_TEMP/bundle"
          find "$RUNNER_TEMP/bundle" -type l | grep -q . && { echo symlink-in-bundle; exit 1; } || true
          echo "BUNDLE=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"; xcodebuild -version
      - name: Prepare the CLI and sync the app
        run: |
          npm ci --no-audit --no-fund
          (cd examples/counter/app && npm ci --no-audit --no-fund)
          node bin/ob-capacitor.mjs sync --project examples/counter/app --bundle "$BUNDLE" --platform ios
      - name: Ephemeral test CA and server certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=obelisk-capacitor test CA" \
            -keyout "$RUNNER_TEMP/ca.key" -out "$RUNNER_TEMP/ca.pem"
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/server.key" -out "$RUNNER_TEMP/server.csr"
          openssl x509 -req -in "$RUNNER_TEMP/server.csr" \
            -CA "$RUNNER_TEMP/ca.pem" -CAkey "$RUNNER_TEMP/ca.key" -CAcreateserial \
            -days 1 -out "$RUNNER_TEMP/server.pem" \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1")
          echo "CA_PEM=$RUNNER_TEMP/ca.pem" >> "$GITHUB_ENV"
          echo "SERVER_PEM=$RUNNER_TEMP/server.pem" >> "$GITHUB_ENV"
          echo "SERVER_KEY=$RUNNER_TEMP/server.key" >> "$GITHUB_ENV"
      - name: Build the native backend from the downloaded bundle
        run: |
          nix-build examples/counter/native-backend.nix --arg bundle "$BUNDLE" -o "$RUNNER_TEMP/backend"
          "$RUNNER_TEMP/backend/bin/backend" --port=8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
      - name: TLS reverse proxy (no auto issuance, no redirect listener)
        run: |
          nix-build examples/counter/default.nix -A pkgs.caddy -o "$RUNNER_TEMP/caddy" >/dev/null 2>&1 || nix-build '<nixpkgs>' -A caddy -o "$RUNNER_TEMP/caddy"
          cat > "$RUNNER_TEMP/Caddyfile" <<'EOF'
          {
            auto_https off
            admin off
          }
          https://localhost:8443 {
            tls "{$SERVER_PEM}" "{$SERVER_KEY}"
            reverse_proxy 127.0.0.1:8000
          }
          EOF
          sed -i '' "s|{\$SERVER_PEM}|$SERVER_PEM|; s|{\$SERVER_KEY}|$SERVER_KEY|" "$RUNNER_TEMP/Caddyfile"
          "$RUNNER_TEMP/caddy/bin/caddy" run --config "$RUNNER_TEMP/Caddyfile" > "$RUNNER_TEMP/caddy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/caddy.pid"
          for i in $(seq 1 30); do
            curl -k -s -o /dev/null https://localhost:8443/ && break
            sleep 1
          done
      - name: Boot the simulator
        run: |
          set -euxo pipefail
          find_runtime() {
            xcrun simctl list runtimes \
              | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9]+-[0-9]+' \
              | sort -V | tail -1
          }
          RUNTIME_ID=$(find_runtime || true)
          if [ -z "$RUNTIME_ID" ]; then
            xcrun simctl list runtimes || true
            xcodebuild -downloadPlatform iOS
            RUNTIME_ID=$(find_runtime)
          fi
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone 16 (" | grep -oE '[0-9A-Fa-f-]{36}' || true)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl create "obelisk-test" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME_ID")
          fi
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl keychain "$UDID" add-root-cert "$CA_PEM"
          echo "DEVICE_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list runtimes | tee "$RUNNER_TEMP/versions-ios.txt"
          xcodebuild -version >> "$RUNNER_TEMP/versions-ios.txt"
      - name: Build the app
        run: |
          cd examples/counter/app
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build \
            | xcbeautify --quieter || xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
          echo "APP=$PWD/build/ios/Build/Products/Debug-iphonesimulator/App.app" >> "$GITHUB_ENV"
      - name: Build WebDriverAgent standalone (full log on failure)
        run: |
          (cd test/ios && npm ci --no-audit --no-fund)
          # appium-webdriveragent is a bundleDependency of the driver, so npm
          # overrides cannot touch it; replace the bundled copy with 16.15.0,
          # which carries the Xcode 26 support we need.
          (cd test/ios \
            && rm -rf node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent \
            && npm pack appium-webdriveragent@16.15.0 --silent \
            && tar -xzf appium-webdriveragent-16.15.0.tgz \
            && mv package node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent \
            && rm -f appium-webdriveragent-16.15.0.tgz)
          WDA=$(find test/ios/node_modules -maxdepth 3 -type d -name appium-webdriveragent | head -1)/WebDriverAgent.xcodeproj
          echo "WDA project: $WDA"
          build_wda() {
            xcodebuild -project "$WDA" -scheme WebDriverAgentRunner \
              -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
              -derivedDataPath "$RUNNER_TEMP/wda-dd" build-for-testing \
              > "$RUNNER_TEMP/wda-build.log" 2>&1
          }
          set +e
          build_wda
          RC=$?
          if [ "$RC" != "0" ] && grep -q "lib_TestingInterop.dylib" "$RUNNER_TEMP/wda-build.log"; then
            # Xcode 26 toolchains keep the testing-interop dylib in a different
            # location than the WDA project expects; bridge it if present.
            echo "interop dylibs present in this Xcode:"
            find /Applications/Xcode_26.2.app -name "*TestingInterop*" 2>/dev/null || true
            echo "platform usr/lib inventory:"
            ls /Applications/Xcode_26.2.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/usr/lib 2>/dev/null || true
            EXPECTED="/Applications/Xcode_26.2.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/usr/lib/lib_TestingInterop.dylib"
            FOUND=$(find /Applications/Xcode_26.2.app -name "lib_TestingInterop.dylib" 2>/dev/null | head -1 || true)
            if [ -n "$FOUND" ] && [ ! -e "$EXPECTED" ]; then
              sudo mkdir -p "$(dirname "$EXPECTED")"
              sudo ln -s "$FOUND" "$EXPECTED"
              echo "linked $FOUND -> $EXPECTED; retrying"
              build_wda
              RC=$?
            elif [ ! -e "$EXPECTED" ]; then
              # Xcode 26.2 does not ship the swift-testing interop dylib the
              # WDA project's copy phase expects. WDA's runner is XCTest-based
              # and never loads it, so a zero-symbol dylib satisfies the copy.
              sudo mkdir -p "$(dirname "$EXPECTED")"
              echo 'void __obelisk_wda_interop_stub(void) {}' | clang -dynamiclib -x objective-c - -o "$EXPECTED"
              echo "stubbed $EXPECTED; retrying"
              build_wda
              RC=$?
            fi
          fi
          set -e
          echo "wda build-for-testing rc=$RC"
          if [ "$RC" != "0" ]; then grep -B3 -A12 -iE "error|failed" "$RUNNER_TEMP/wda-build.log" | tail -80; exit 1; fi
      - name: Appium and the acceptance script
        run: |
          cd test/ios
          npm ci --no-audit --no-fund
          export APPIUM_HOME="$RUNNER_TEMP/appium-home"
          node node_modules/appium/build/lib/main.js driver install --source=local "$PWD/node_modules/appium-xcuitest-driver"
          cd ../..
          env \
            APPIUM_OS=ios \
            APP="$APP" \
            BACKEND_ORIGIN=https://localhost:8443 \
            PLATFORM_DIR=test/ios \
            DEVICE_UDID="$DEVICE_UDID" \
            DEVICE_NAME="$SIM_DEVICE" \
            PLATFORM_VERSION=26.2 \
            CADDY_PID="$(cat "$RUNNER_TEMP/caddy.pid")" \
            ARTIFACTS_DIR="$RUNNER_TEMP/artifacts" \
            node test/native.mjs
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/versions-*.txt "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          cp "$BUNDLE/all.js.sha256" "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-evidence
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    needs: bundle
    timeout-minutes: 120
    env:
      JDK_VERSION: "21"
      AVD_NAME: obelisk-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JDK_VERSION }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            allow-import-from-derivation = true
            extra-substituters = https://cache.nixos.org https://cache.iog.io https://nixcache.reflex-frp.org
            extra-trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= ryantrinkle.com-1:JJiAKaRv9mWgpVAz8dwewnZe0AzzEAzPkagE9SP5NWI=
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
      - name: Unpack the web bundle
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf web-bundle.tar.gz -C "$RUNNER_TEMP/bundle"
          echo "BUNDLE=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"
      - name: Prepare the CLI and sync the app
        run: |
          npm ci --no-audit --no-fund
          (cd examples/counter/app && npm ci --no-audit --no-fund)
          node bin/ob-capacitor.mjs sync --project examples/counter/app --bundle "$BUNDLE" --platform android
      - name: Ephemeral test CA baked into the debug build
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=obelisk-capacitor test CA" \
            -keyout "$RUNNER_TEMP/ca.key" -out "$RUNNER_TEMP/ca.pem"
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$RUNNER_TEMP/server.key" -out "$RUNNER_TEMP/server.csr"
          openssl x509 -req -in "$RUNNER_TEMP/server.csr" \
            -CA "$RUNNER_TEMP/ca.pem" -CAkey "$RUNNER_TEMP/ca.key" -CAcreateserial \
            -days 1 -out "$RUNNER_TEMP/server.pem" \
            -extfile <(printf "subjectAltName=DNS:localhost,IP:127.0.0.1")
          cp "$RUNNER_TEMP/ca.pem" examples/counter/app/android/app/src/debug/res/raw/test_ca.pem
          echo "CA_PEM=$RUNNER_TEMP/ca.pem" >> "$GITHUB_ENV"
          echo "SERVER_PEM=$RUNNER_TEMP/server.pem" >> "$GITHUB_ENV"
          echo "SERVER_KEY=$RUNNER_TEMP/server.key" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: linux-backend
      - name: Restore the prebuilt Linux backend
        run: |
          tar -xzf backend-closure.tar.gz
          BACKEND_OUT=$(cat backend-path.txt)
          # The closure carries binary-cache-substituted paths; it is our own
          # artifact, so signature checking is not the trust boundary here.
          nix copy --no-check-sigs --from file://$PWD/backend-closure "$BACKEND_OUT"
          echo "BACKEND_OUT=$BACKEND_OUT" >> "$GITHUB_ENV"
          "$BACKEND_OUT/bin/backend" --port=8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
      - name: TLS reverse proxy
        run: |
          nix-build examples/counter/default.nix -A pkgs.caddy -o "$RUNNER_TEMP/caddy"
          cat > "$RUNNER_TEMP/Caddyfile" <<EOF
          {
            auto_https off
            admin off
          }
          https://localhost:8443 {
            tls "$SERVER_PEM" "$SERVER_KEY"
            reverse_proxy 127.0.0.1:8000
          }
          EOF
          "$RUNNER_TEMP/caddy/bin/caddy" run --config "$RUNNER_TEMP/Caddyfile" > "$RUNNER_TEMP/caddy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/caddy.pid"
          for i in $(seq 1 30); do
            curl -k -s -o /dev/null https://localhost:8443/ && break
            sleep 1
          done
      - name: SDK, emulator, AVD
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)
          AVDMANAGER=$(dirname "$SDKMANAGER")/avdmanager
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-35;google_apis;x86_64" > /dev/null
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd -n "$AVD_NAME" -k "system-images;android-35;google_apis;x86_64" -d pixel_6 --force
          # The emulator only sees AVDs from ANDROID_AVD_HOME; verify before booting.
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -x "$AVD_NAME"
          sudo chown -R "$USER" /dev/kvm || true
          echo "DEVICE_UDID=emulator-5554" >> "$GITHUB_ENV"
          # Boot now; the app build runs while the emulator settles.
          nohup "$ANDROID_HOME/emulator/emulator" -avd "$AVD_NAME" -no-window -no-audio -no-boot-anim -accel on -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          BOOT=""
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            sleep 5
          done
          [ "$BOOT" = "1" ] || { echo 'emulator failed to boot'; tail -80 "$RUNNER_TEMP/emulator.log"; exit 1; }
          adb shell getprop ro.build.version.release > "$RUNNER_TEMP/versions-android.txt"
          adb shell dumpsys package com.google.android.webview | grep -m1 versionName >> "$RUNNER_TEMP/versions-android.txt" || true
      - name: Build the app
        run: |
          cd examples/counter/app/android
          ./gradlew assembleDebug --no-daemon
          echo "APP=$PWD/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          ./gradlew --version | tee -a "$RUNNER_TEMP/versions-android.txt"
      - name: Map runner TLS to the device
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          adb reverse tcp:8443 tcp:8443
      - name: Appium and the acceptance script
        run: |
          cd test/android
          npm ci --no-audit --no-fund
          export APPIUM_HOME="$RUNNER_TEMP/appium-home"
          node node_modules/appium/build/lib/main.js driver install --source=local "$PWD/node_modules/appium-uiautomator2-driver"
          export CHROMEDRIVER_EXECUTABLE_DIR="$RUNNER_TEMP/chromedrivers"
          mkdir -p "$CHROMEDRIVER_EXECUTABLE_DIR"
          cd ../..
          env \
            APPIUM_OS=android \
            APP="$APP" \
            BACKEND_ORIGIN=https://localhost:8443 \
            PLATFORM_DIR=test/android \
            DEVICE_UDID=emulator-5554 \
            CADDY_PID="$(cat "$RUNNER_TEMP/caddy.pid")" \
            ARTIFACTS_DIR="$RUNNER_TEMP/artifacts" \
            CHROMEDRIVER_EXECUTABLE_DIR="$CHROMEDRIVER_EXECUTABLE_DIR" \
            node test/native.mjs
          grep -m1 "Chromedriver" "$RUNNER_TEMP/artifacts/appium-android.log" >> "$RUNNER_TEMP/versions-android.txt" 2>/dev/null || true
      - name: Collect evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifacts"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          cp "$RUNNER_TEMP"/versions-*.txt "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
          cp "$BUNDLE/all.js.sha256" "$RUNNER_TEMP/artifacts/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-evidence
          path: ${{ runner.temp }}/artifacts/
          retention-days: 14

  record:
    # Both platforms green -> append the exercised matrix to compatibility.json
    # and commit it back, so evidence lands in the repository itself.
    runs-on: ubuntu-24.04
    needs: [ios, android]
    if: github.event_name != 'pull_request' && success()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: evidence
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Record the run
        run: |
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          node scripts/record-compatibility.mjs "$RUN_URL" evidence
          cat compatibility.json
      - name: Commit the recorded matrix
        run: |
          git config user.name "obelisk-capacitor-ci"
          git config user.email "actions@users.noreply.github.com"
          git add compatibility.json
          git commit -m "Record native CI run $GITHUB_RUN_ID in compatibility.json" || exit 0
          git push
